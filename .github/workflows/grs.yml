name: Atualizar Cartoes do README
on:
  schedule:
    - cron: "0 3 * * *" # Atualiza todo dia às 3 da manhã
  workflow_dispatch: # Permite atualizar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cartao de estatisticas
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Andre-MB&bg_color=000000&border_color=4B0082&show_icons=true&icon_color=DAA520&title_color=DAA520&text_color=ffffff&include_all_commits=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar cartao de linguagens
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=Andre-MB&layout=compact&langs_count=8&bg_color=000000&border_color=4B0082&title_color=DAA520&text_color=ffffff&icon_color=DAA520&hide=css,html
          path: profile/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar imagens no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@://github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
